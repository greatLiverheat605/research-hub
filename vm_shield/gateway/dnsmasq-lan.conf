# DHCP only. Never provide a DNS relay that could expose the host/gateway resolver.
port=0
interface=lan0
bind-interfaces
dhcp-authoritative
dhcp-range=10.77.0.10,10.77.0.20,255.255.255.0,12h
dhcp-host=52:54:00:77:00:03,10.77.0.3
dhcp-option=option:router,10.77.0.1
# Use an IP-literal DNS destination; guest Mihomo TUN intercepts UDP/TCP port 53.
# Without guest TUN it is blocked by the gateway, never resolved via host DNS.
dhcp-option=option:dns-server,1.1.1.1
# Clamp LAN MTU to 1380 to prevent double-tunnel (SS over VLESS) fragmentation.
dhcp-option=option:mtu,1380
